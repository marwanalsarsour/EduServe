version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: eduserve-app
    volumes:
      - ./src:/var/www/html
    networks:
      - eduserve-network

  web:
    image: nginx:latest
    container_name: eduserve-web
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - eduserve-network

  db:
    image: mysql:8.0
    container_name: eduserve-db
    restart: always
    environment:
      MYSQL_DATABASE: eduserve_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: user
      MYSQL_PASSWORD: user_password
    ports:
      - "3306:3306"
    # التعديل الأساسي هنا لحفظ البيانات
    volumes:
      - eduserve-db-data:/var/lib/mysql
    networks:
      - eduserve-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: eduserve-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password
    depends_on:
      - db
    networks:
      - eduserve-network

volumes:
  eduserve-db-data:

networks:
  eduserve-network:
    driver: bridge
